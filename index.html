<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stick Chop</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#020617;color:#fff;font-family:Arial,sans-serif}
.tab-active{background:linear-gradient(to right,#9333ea,#db2777)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:50}
.modal-box{width:100%;max-width:440px;max-height:85vh;overflow:auto;background:#0f172a;border:1px solid #334155;border-radius:24px;padding:18px}
.hidden{display:none!important}
</style>
</head>
<body>

<header class="sticky top-0 z-40 bg-slate-900/95 border-b border-slate-800 p-4 flex justify-between items-center">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-xl">🪓</div>
    <div>
      <h1 class="font-black text-lg text-purple-300">STICK CHOP</h1>
      <p class="text-xs text-slate-400">Магазин стикеров + Игра</p>
    </div>
  </div>
  <button onclick="openCart()" class="relative bg-slate-800 border border-slate-700 rounded-xl px-3 py-2">
    🛒 <span id="cart-count" class="absolute -top-2 -right-2 bg-pink-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
  </button>
</header>

<div class="flex border-b border-slate-800">
  <button id="tab-shop" class="flex-1 py-3 text-sm font-semibold tab-active" onclick="showShop()">🛍️ Магазин</button>
  <button id="tab-game" class="flex-1 py-3 text-sm font-semibold text-slate-400" onclick="showGame()">🪓 Игра Stick Chop</button>
</div>

<main id="shop-section" class="max-w-md mx-auto p-4 pb-28">
  <input id="search" type="search" placeholder="Поиск стикеров..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm mb-4 outline-none">
  <div class="flex justify-between items-center mb-3">
    <h2 class="font-bold text-sm">Каталог стикеров (20)</h2>
    <span class="text-xs bg-amber-500/20 text-amber-300 px-2 py-1 rounded-lg">12-15 ⭐</span>
  </div>
  <div id="products" class="grid grid-cols-2 gap-3"></div>
</main>

<main id="game-section" class="max-w-md mx-auto p-4 pb-28 hidden">
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 text-center mb-4">
    <div class="text-6xl mb-3">🪓</div>
    <h2 class="text-xl font-bold">Stick Chop</h2>
    <p class="text-sm text-slate-400 mt-1">Рабочие рубят дерево даже когда ты оффлайн</p>
  </div>

  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
      <div class="text-3xl">🪵</div>
      <div id="wood" class="text-2xl font-bold text-amber-300">0</div>
      <div class="text-xs text-slate-400">Дерево</div>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
      <div class="text-3xl">💰</div>
      <div id="money" class="text-2xl font-bold text-green-400">0</div>
      <div class="text-xs text-slate-400">Деньги</div>
    </div>
  </div>

  <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-4">
    <div class="flex justify-between text-sm mb-2">
      <span>👷 Рабочих: <b id="workers">1</b></span>
      <span>⚡ Сила: <b id="power">1.0</b></span>
    </div>
    <div class="text-xs text-slate-400">Производство: <span id="prod">1.0</span> дерева/сек</div>
  </div>

  <button onclick="hire()" class="w-full bg-purple-600 hover:bg-purple-500 py-3.5 rounded-xl font-bold mb-3 transition active:scale-95">
    Нанять рабочего (<span id="hire-cost">50</span> 💰)
  </button>
  <button onclick="upgrade()" class="w-full bg-pink-600 hover:bg-pink-500 py-3.5 rounded-xl font-bold transition active:scale-95">
    Улучшить силу (<span id="upgrade-cost">100</span> 💰)
  </button>

  <div class="text-center
