
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sticker Shop</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Предотвращение лишнего скролла и системных выделений на смартфонах */
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white font-sans antialiased">

    <!-- Шапка приложения -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center text-base shadow">
                ✨
            </div>
            <div>
                <h1 class="text-base font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-amber-300 bg-clip-text text-transparent leading-tight">Sticker Shop</h1>
                <p class="text-[11px] text-slate-400">Эксклюзивные паки для Telegram</p>
            </div>
        </div>
        <button id="cart-btn" class="relative bg-slate-800/90 hover:bg-slate-700 border border-slate-700 px-3 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5 shadow-md active:scale-95">
            🛒 <span id="cart-count" class="absolute -top-2 -right-2 bg-pink-500 text-white text-xs px-2 py-0.5 rounded-full font-bold shadow-md">0</span>
        </button>
    </header>

    <!-- Основной каталог -->
    <main class="p-4 max-w-md mx-auto flex-1 w-full pb-20">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-sm font-semibold text-slate-200 uppercase tracking-wide">Популярные стикерпаки</h2>
            <span class="text-xs text-amber-400 font-semibold bg-amber-400/10 px-2 py-0.5 rounded-md border border-amber-400/20">Все по 40–60 ⭐</span>
        </div>
        
        <!-- Сетка товаров -->
        <div id="products-grid" class="grid grid-cols-2 gap-3.5">
            <!-- Карточки генерируются скриптом -->
        </div>
    </main>

    <!-- Модальное окно корзины -->
    <div id="cart-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity duration-200">
        <div class="bg-slate-900 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 border border-slate-800 shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <span class="text-lg">🛍️</span>
                    <h3 class="font-bold text-base text-white">Ваша корзина</h3>
                </div>
                <button id="close-cart" class="text-slate-400 hover:text-white text-2xl w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center leading-none">&times;</button>
            </div>
            
            <div id="cart-items" class="flex-1 overflow-y-auto space-y-2.5 mb-4 pr-1">
                <!-- Товары добавляются сюда динамически -->
            </div>

            <div class="border-t border-slate-800 pt-3 mt-auto">
                <div class="flex justify-between items-center mb-3 text-sm font-semibold">
                    <span class="text-slate-300">Итого к оплате:</span>
                    <span id="cart-total" class="text-amber-300 font-bold text-base">0 ⭐</span>
                </div>
                <button id="checkout-btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-95 py-3.5 rounded-xl font-bold text-white transition shadow-lg shadow-pink-600/20 active:scale-[0.98]">
                    Оплатить заказ
                </button>
            </div>
        </div>
    </div>

    <!-- Уведомление об успешном заказе -->
    <div id="success-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 w-full max-w-sm rounded-2xl p-6 border border-slate-800 shadow-2xl text-center">
            <div class="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-3">
                ✓
            </div>
            <h3 class="text-lg font-bold text-white mb-1">Заказ сформирован!</h3>
            <p id="success-message" class="text-xs text-slate-300 mb-4 leading-relaxed"></p>
            <button id="close-success" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-semibold transition">
                Отлично
            </button>
        </div>
    </div>

    <script>
        // 1. Безопасная инициализация Telegram WebApp
        let tg = null;
        if (typeof window !== 'undefined' && window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            try {
                tg.ready();
                tg.expand();
            } catch (err) {
                console.warn('Telegram WebApp init failed:', err);
            }
        }

        // Вспомогательная функция тактильного отклика (haptic feedback)
        function triggerHaptic(style = 'light') {
            if (tg && tg.HapticFeedback) {
                try {
                    tg.HapticFeedback.impactOccurred(style);
                } catch (e) {}
            }
        }

        // 2. Список стикерпаков с надежными изображениями и fallback-иконками
        const products = [
            { 
                id: 1, 
                name: 'Cyber Cat Pack', 
                price: 50, 
                emoji: '😼',
                image: 'https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=400&auto=format&fit=crop&q=80' 
            },
            { 
                id: 2, 
                name: 'Crypto Pepe', 
                price: 50, 
                emoji: '🐸',
                image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=80' 
            },
            { 
                id: 3, 
                name: 'Anime Vibes', 
                price: 60, 
                emoji: '🌸',
                image: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=400&auto=format&fit=crop&q=80' 
            },
            { 
                id: 4, 
                name: 'Pixel Ducks', 
                price: 40, 
                emoji: '🦆',
                image: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400&auto=format&fit=crop&q=80' 
            }
        ];

        let cart = [];

        // 3. Функция безопасной отрисовки товаров
        function renderProducts() {
            const grid = document.getElementById('products-grid');
            if (!grid) return;
            
            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 flex flex-col justify-between shadow-md hover:border-slate-700 transition">
                        <div>
                            <div class="relative w-full h-32 rounded-xl overflow-hidden mb-2.5 bg-slate-800 flex items-center justify-center">
                                <img 
                                    src="${p.image}" 
                                    alt="${p.name}" 
                                    class="w-full h-full object-cover"
                                    onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\\'text-4xl\\'>${p.emoji}</span>';"
                                />
                            </div>
                            <h3 class="font-medium text-xs text-slate-200 line-clamp-1">${p.name}</h3>
                        </div>
                        <div class="flex justify-between items-center mt-3 pt-2 border-t border-slate-800/60">
                            <span class="text-amber-400 font-bold text-xs">${p.price} ⭐</span>
                            <button onclick="addToCart(${p.id})" class="bg-purple-600 hover:bg-purple-500 text-white w-8 h-8 rounded-xl text-sm font-bold flex items-center justify-center transition active:scale-95 shadow-md">
                                +
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // 4. Логика корзины
        window.addToCart = function(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
            triggerHaptic('light');
        };

        window.removeFromCart = function(id) {
            cart = cart.filter(i => i.id !== id);
            updateCartUI();
            triggerHaptic('medium');
        };

        window.changeQty = function(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;

            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
            triggerHaptic('light');
        };

        function updateCartUI() {
            const totalCount = cart.reduce((sum, i) => sum + i.quantity, 0);
            const countEl = document.getElementById('cart-count');
            if (countEl) countEl.innerText = totalCount;

            const container = document.getElementById('cart-items');
            if (!container) return;

            container.innerHTML = '';
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8">
                        <span class="text-2xl mb-1 block">🛒</span>
                        <p class="text-slate-400 text-xs">Ваша корзина пока пуста</p>
                    </div>
                `;
            } else {
                cart.forEach(item => {
                    container.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/60">
                            <div class="min-w-0 pr-2">
                                <h4 class="text-xs font-medium text-slate-200 truncate">${item.name}</h4>
                                <p class="text-[11px] text-amber-400 font-semibold">${item.price} ⭐</p>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <div class="flex items-center gap-1 bg-slate-900 border border-slate-800 rounded-lg p-0.5">
                                    <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 text-slate-400 hover:text-white flex items-center justify-center text-xs font-bold active:scale-95">−</button>
                                    <span class="text-xs font-mono font-bold px-1 text-white">${item.quantity}</span>
                                    <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 text-slate-400 hover:text-white flex items-center justify-center text-xs font-bold active:scale-95">+</button>
                                </div>
                                <button onclick="removeFromCart(${item.id})" class="text-rose-400 hover:text-rose-300 text-xs p-1">✕</button>
                            </div>
                        </div>
                    `;
                });
            }

            const totalPrice = cart.reduce((sum, i) => sum + (itemPrice(i)), 0);
            const totalEl = document.getElementById('cart-total');
            if (totalEl) totalEl.innerText = `${totalPrice} ⭐`;
        }

        function itemPrice(item) {
            return item.price * item.quantity;
        }

        // 5. Инициализация модальных окон и обработчиков событий
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            updateCartUI();

            const modal = document.getElementById('cart-modal');
            const cartBtn = document.getElementById('cart-btn');
            const closeBtn = document.getElementById('close-cart');
            const checkoutBtn = document.getElementById('checkout-btn');
            
            const successModal = document.getElementById('success-modal');
            const closeSuccessBtn = document.getElementById('close-success');
            const successMsg = document.getElementById('success-message');

            if (cartBtn && modal) {
                cartBtn.addEventListener('click', () => {
                    triggerHaptic('light');
                    modal.classList.remove('hidden');
                });
            }

            if (closeBtn && modal) {
                closeBtn.addEventListener('click', () => {
                    modal.classList.add('hidden');
                });
            }

            // Закрытие модального окна по клику на фон
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) modal.classList.add('hidden');
                });
            }

            if (closeSuccessBtn && successModal) {
                closeSuccessBtn.addEventListener('click', () => {
                    successModal.classList.add('hidden');
                });
            }

            // Оформление заказа
            if (checkoutBtn) {
                checkoutBtn.addEventListener('click', () => {
                    if (cart.length === 0) {
                        alert('Добавьте товары в корзину');
                        return;
                    }
                    
                    triggerHaptic('heavy');
                    const orderData = JSON.stringify(cart);

                    // Если открыто внутри Telegram Mini App и поддерживается sendData
                    let sentToBot = false;
                    if (tg && typeof tg.sendData === 'function') {
                        try {
                            tg.sendData(orderData);
                            sentToBot = true;
                        } catch (err) {
                            console.warn('tg.sendData error (обычно возникает, если Mini App открыт не через Keyboard Button):', err);
                        }
                    }

                    // Закрываем корзину и очищаем
                    if (modal) modal.classList.add('hidden');
                    const totalSum = cart.reduce((sum, i) => sum + itemPrice(i), 0);
                    cart = [];
                    updateCartUI();

                    // Отображаем подтверждение
                    if (successModal && successMsg) {
                        successMsg.innerHTML = sentToBot 
                            ? `Данные заказа на сумму <strong>${totalSum} ⭐</strong> успешно переданы в Telegram-бот!`
                            : `Заказ на сумму <strong>${totalSum} ⭐</strong> оформлен.<br><span class="text-slate-400 text-[10px]">Приложение запущено в браузере (режим демонстрации).</span>`;
                        successModal.classList.remove('hidden');
                    }
                });
            }
        });
    </script>
</body>
</html>
