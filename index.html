<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-4">
  <h1 class="text-2xl font-bold mb-4">Тест стикеров</h1>
  <div id="box" class="grid grid-cols-2 gap-3"></div>
  <script>
    const BASE = "https://kovunov155-debug.github.io/Stickerchop./";
    const files = [
      "grok_1793863248535.jpg",
      "grok_1793863263231.jpg",
      "grok_1793863828992.png",
      "grok_1793863836019.png"
    ];
    const box = document.getElementById("box");
    files.forEach(f => {
      const img = document.createElement("img");
      img.src = BASE + f;
      img.className = "w-full rounded-xl border border-slate-700";
      img.onerror = () => img.style.border = "2px solid red";
      box.appendChild(img);
    });
  </script>
</body>
</html>
