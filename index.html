<!-- Шапка приложения -->
<header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4 flex justify-between items-center">
    <div>
        <h1 class="text-lg font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">Sticker Shop</h1>
        <p class="text-xs text-slate-400">Эксклюзивные паки для Telegram</p>
    </div>
    <button id="cart-btn" class="relative bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5 shadow-md">
        🛒 <span id="cart-count" class="absolute -top-2 -right-2 bg-pink-500 text-white text-xs px-2 py-0.5 rounded-full font-bold shadow">0</span>
    </button>
</header>

<!-- Основной каталог -->
<main class="p-4 max-w-md mx-auto">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-semibold text-slate-200">Популярные стикерпаки</h2>
        <span class="text-xs text-purple-400 font-medium">Все по 50 ⭐</span>
    </div>
    
    <!-- Сетка товаров -->
    <div id="products-grid" class="grid grid-cols-2 gap-3.5">
        <!-- Карточки генерируются скриптом ниже -->
    </div>
</main>

<!-- Модальное окно корзины -->
<div id="cart-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
    <div class="bg-slate-900 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 border border-slate-800 shadow-2xl max-h-[85vh] flex flex-col">
        <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
            <h3 class="font-bold text-base">Ваша корзина</h3>
            <button id="close-cart" class="text-slate-400 hover:text-white text-2xl px-2">&times;</button>
        </div>
        
        <div id="cart-items" class="flex-1 overflow-y-auto space-y-3 mb-4 pr-1">
            <!-- Товары добавляются сюда -->
        </div>

        <div class="border-t border-slate-800 pt-3 mt-auto">
            <div class="flex justify-between items-center mb-3 text-base font-semibold">
                <span class="text-slate-300">Итого к оплате:</span>
                <span id="cart-total" class="text-pink-400 font-bold">0 ⭐</span>
            </div>
            <button id="checkout-btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-95 py-3 rounded-xl font-bold transition shadow-lg shadow-pink-600/20 active:scale-[0.98]">
                Оплатить заказ
            </button>
        </div>
    </div>
</div>

<script>
    // Инициализация Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // Пример списка товаров (стикерпаков)
    const products = [
        { id: 1, name: 'Cyber Cat Pack', price: 50, image: 'https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=300&auto=format&fit=crop&q=60' },
        { id: 2, name: 'Crypto Pepe', price: 50, image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&auto=format&fit=crop&q=60' },
        { id: 3, name: 'Anime Vibes', price: 60, image: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=300&auto=format&fit=crop&q=60' },
        { id: 4, name: 'Pixel Ducks', price: 40, image: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300&auto=format&fit=crop&q=60' }
    ];

    let cart = [];

    // Отрисовка каталога
    const grid = document.getElementById('products-grid');
    products.forEach(p => {
        grid.innerHTML += `
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 flex flex-col justify-between shadow-md hover:border-slate-700 transition">
                <div>
                    <img src="${p.image}" alt="${p.name}" class="rounded-xl mb-2.5 w-full h-32 object-cover bg-slate-800">
                    <h3 class="font-medium text-xs text-slate-200 line-clamp-1">${p.name}</h3>
                </div>
                <div class="flex justify-between items-center mt-3 pt-2 border-t border-slate-800/60">
                    <span class="text-pink-400 font-bold text-xs">${p.price} ⭐</span>
                    <button onclick="addToCart(${p.id})" class="bg-purple-600 hover:bg-purple-500 text-white w-7 h-7 rounded-xl text-sm font-bold flex items-center justify-center transition active:scale-95">+</button>
                </div>
            </div>
        `;
    });

    function addToCart(id) {
        const product = products.find(p => p.id === id);
        const item = cart.find(i => i.id === id);
        if (item) {
            item.quantity++;
        } else {
            cart.push({ ...product, quantity: 1 });
        }
        updateCartUI();
        
        // Легкая вибрация при добавлении (если поддерживается клиентом)
        if (tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('light');
        }
    }

    function removeFromCart(id) {
        cart = cart.filter(i => i.id !== id);
        updateCartUI();
    }

    function updateCartUI() {
        const totalCount = cart.reduce((sum, i) => sum + i.quantity, 0);
        document.getElementById('cart-count').innerText = totalCount;

        const container = document.getElementById('cart-items');
        container.innerHTML = '';
        
        if (cart.length === 0) {
            container.innerHTML = '<p class="text-slate-500 text-center py-8 text-xs">Ваша корзина пока пуста</p>';
        } else {
            cart.forEach(item => {
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-950/40 p-2.5 rounded-xl border border-slate-800/40">
                        <div>
                            <h4 class="text-xs font-medium text-slate-200">${item.name}</h4>
                            <p class="text-[10px] text-slate-400">${item.price} ⭐ × ${item.quantity}</p>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-red-400 hover:text-red-300 text-xs px-2 py-1">Удалить</button>
                    </div>
                `;
            });
        }

        const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
        document.getElementById('cart-total').innerText = `${totalPrice} ⭐`;
    }

    // Модальное окно
    const modal = document.getElementById('cart-modal');
    document.getElementById('cart-btn').addEventListener('click', () => modal.classList.remove('hidden'));
    document.getElementById('close-cart').addEventListener('click', () => modal.classList.add('hidden'));

    // Кнопка оформления заказа -> отправка данных боту
    document.getElementById('checkout-btn').addEventListener('click', () => {
        if (cart.length === 0) {
            alert('Добавьте товары в корзину');
            return;
        }
        
        // Упаковываем заказ и отправляем обратно в Telegram-бота
        const orderData = JSON.stringify(cart);
        tg.sendData(orderData); 
    });
</script>
