<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stick Chop — Mario</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
canvas{display:block;margin:0 auto;background:#1e293b;border-radius:12px;touch-action:none}
.btn{user-select:none;-webkit-user-select:none}
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2">

<div class="w-full max-w-md">
  <div class="flex justify-between items-center mb-3 px-2">
    <div class="text-lg font-bold">🍄 Stick Mario</div>
    <div class="text-sm">Монеты: <span id="score" class="font-bold text-amber-400">0</span></div>
  </div>
  <canvas id="game" width="360" height="480"></canvas>
  <div class="flex justify-center gap-4 mt-4">
    <button id="left" class="btn bg-slate-700 w-16 h-16 rounded-xl text-2xl">◀</button>
    <button id="jump" class="btn bg-purple-600 w-16 h-16 rounded-xl text-2xl">⬆</button>
    <button id="right" class="btn bg-slate-700 w-16 h-16 rounded-xl text-2xl">▶</button>
  </div>
  <div class="text-center text-xs text-slate-400 mt-3">Тапай кнопки или свайпай по экрану</div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");

let score = 0;
let keys = { left: false, right: false, jump: false };

const player = { x: 80, y: 300, w: 28, h: 36, vx: 0, vy: 0, onGround: false };
const gravity = 0.6;
const jumpForce = -12;
const speed = 3.2;

const platforms = [
  { x: 0, y: 430, w: 360, h: 50 },
  { x: 40, y: 340, w: 100, h: 16 },
  { x: 180, y: 280, w: 120, h: 16 },
  { x: 60, y: 200, w: 90, h: 16 },
  { x: 220, y: 160, w: 100, h: 16 },
  { x: 100, y: 100, w: 140, h: 16 },
];

let coins = [
  { x: 90, y: 310, r: 8, got: false },
  { x: 230, y: 250, r: 8, got: false },
  { x: 120, y: 170, r: 8, got: false },
  { x: 260, y: 130, r: 8, got: false },
  { x: 160, y: 70, r: 8, got: false },
];

function resetLevel() {
  player.x = 80; player.y = 300; player.vx = 0; player.vy = 0;
  coins.forEach(c => c.got = false);
}

function update() {
  // movement
  if (keys.left) player.vx = -speed;
  else if (keys.right) player.vx = speed;
  else player.vx *= 0.8;

  if (keys.jump && player.onGround) {
    player.vy = jumpForce;
    player.onGround = false;
  }

  player.vy += gravity;
  player.x += player.vx;
  player.y += player.vy;

  // bounds
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

  // platforms
  player.onGround = false;
  for (const p of platforms) {
    if (player.x + player.w > p.x && player.x < p.x + p.w &&
        player.y + player.h > p.y && player.y + player.h < p.y + p.h + 10 &&
        player.vy >= 0) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
    }
  }

  // fall
  if (player.y > canvas.height) resetLevel();

  // coins
  for (const c of coins) {
    if (!c.got && Math.hypot(player.x + player.w/2 - c.x, player.y + player.h/2 - c.y) < 20) {
      c.got = true;
      score += 10;
      scoreEl.textContent = score;
    }
  }

  // win
  if (coins.every(c => c.got)) {
    setTimeout(() => { alert("Уровень пройден! +50"); score += 50; scoreEl.textContent = score; resetLevel(); }, 100);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // platforms
  ctx.fillStyle = "#334155";
  platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

  // coins
  coins.forEach(c => {
    if (!c.got) {
      ctx.fillStyle = "#fbbf24";
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // player
  ctx.fillStyle = "#a855f7";
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = "#fff";
  ctx.fillRect(player.x + 6, player.y + 8, 6, 6);
  ctx.fillRect(player.x + 16, player.y + 8, 6, 6);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// buttons
document.getElementById("left").ontouchstart = () => keys.left = true;
document.getElementById("left").ontouchend = () => keys.left = false;
document.getElementById("right").ontouchstart = () => keys.right = true;
document.getElementById("right").ontouchend = () => keys.right = false;
document.getElementById("jump").ontouchstart = () => keys.jump = true;
document.getElementById("jump").ontouchend = () => keys.jump = false;

// keyboard
window.onkeydown = e => {
  if (e.key === "ArrowLeft") keys.left = true;
  if (e.key === "ArrowRight") keys.right = true;
  if (e.key === " " || e.key === "ArrowUp") keys.jump = true;
};
window.onkeyup = e => {
  if (e.key === "ArrowLeft") keys.left = false;
  if (e.key === "ArrowRight") keys.right = false;
  if (e.key === " " || e.key === "ArrowUp") keys.jump = false;
};

loop();
</script>
</body>
</html>
